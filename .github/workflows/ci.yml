name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"          # weekly: new advisories for the locked dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - name: Lock files are up to date with their .in files
        run: |
          pip install uv
          scripts/lock.sh --check
      - name: Scanner package builds, passes twine check and installs
        run: scripts/build_dist.sh

  test:
    name: test (python ${{ matrix.python }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mergeclear
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mergeclear
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mergeclear" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MERGECLEAR_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://mergeclear:test@localhost:5432/mergeclear' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install (locked, hash-checked)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e ./scanner
      - name: Scanner tests
        if: matrix.db == 'sqlite'
        working-directory: scanner
        run: python -m pytest -q
      - name: Server tests (incl. migrations) on ${{ matrix.db }}
        working-directory: server
        run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Known vulnerabilities in the locked dependencies
        run: pip-audit --require-hashes --disable-pip -r scanner/requirements.txt -r server/requirements.txt

  docker:
    name: images + end-to-end smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build both images, run Postgres + server, upload a scan with the scanner image
        run: scripts/smoke_test.sh
