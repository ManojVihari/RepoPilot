# For developers: `cd server && alembic revision --autogenerate -m "what changed"`.
# The server applies migrations itself on start (app.db.migrate); the database
# URL comes from MERGECLEAR_DATABASE_URL like everywhere else.
[alembic]
prepend_sys_path = .
script_location = app/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
